<form
    hx-post="/movimientos/{{ tx.id }}/categoria"
    hx-target="#cat-{{ tx.id }}"
    hx-swap="innerHTML"
    class="row"
    style="gap:.35rem;">
    <select name="category_id" class="select btn-sm" style="padding:.3rem .5rem; font-size:.82rem;"
            onchange="this.form.requestSubmit()">
        <option value="null" {% if not tx.cat_id %}selected{% endif %}>— Sin categoría —</option>
        {% for p in cat_tree %}
            <option value="{{ p.id }}" {% if tx.cat_id == p.id %}selected{% endif %}>{{ p.name }}</option>
            {% for c in p.children %}
                <option value="{{ c.id }}" {% if tx.cat_id == c.id %}selected{% endif %}>&nbsp;&nbsp;{{ c.name }}</option>
            {% endfor %}
        {% endfor %}
    </select>
</form>
