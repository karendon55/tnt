<form
    hx-post="/movimientos/{{ tx.id }}/memo"
    hx-target="#memo-{{ tx.id }}"
    hx-swap="innerHTML"
    hx-trigger="blur from:find input, keydown[key=='Enter'] from:find input"
    class="row"
    onsubmit="return false;">
    <input
        type="text"
        name="memo"
        value="{{ tx.memo }}"
        placeholder="—"
        class="cell-edit"
        aria-label="Memo del movimiento"
        maxlength="500">
</form>
