<form
    hx-post="/movimientos/{{ tx.id }}/memo"
    hx-target="#memo-{{ tx.id }}"
    hx-swap="innerHTML"
    hx-trigger="blur from:find input, keydown[key=='Enter'] from:find input"
    class="row"
    style="gap:.35rem;"
    onsubmit="return false;">
    <input
        type="text"
        name="memo"
        value="{{ tx.memo }}"
        placeholder="—"
        class="input btn-sm"
        style="padding:.3rem .5rem; font-size:.82rem; width:100%; min-width:140px;"
        maxlength="500">
</form>
