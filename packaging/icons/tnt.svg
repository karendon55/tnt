<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256" viewBox="0 0 256 256"
     role="img" aria-label="TNT — Tus Números Tranquilos">
  <title>TNT — Tus Números Tranquilos</title>
  <defs>
    <linearGradient id="tntBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0a0a"/>
      <stop offset="55%"  stop-color="#1a0606"/>
      <stop offset="100%" stop-color="#3a0a0a"/>
    </linearGradient>
    <linearGradient id="tntBolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f5f5f5"/>
      <stop offset="55%"  stop-color="#cfd2d6"/>
      <stop offset="100%" stop-color="#9aa0a6"/>
    </linearGradient>
    <filter id="tntShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="tntGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo redondeado tipo "app icon" -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48"
        fill="url(#tntBg)" stroke="#cf2026" stroke-width="3"/>

  <!-- Halo rojo AC/DC tras el rayo -->
  <g filter="url(#tntGlow)" opacity="0.55">
    <path d="M152 32 L40 144 L112 144 L88 224 L216 112 L136 112 L152 32 Z"
          fill="#cf2026"/>
  </g>

  <!-- Rayo principal en plata -->
  <g filter="url(#tntShadow)">
    <path d="M152 32 L40 144 L112 144 L88 224 L216 112 L136 112 L152 32 Z"
          fill="url(#tntBolt)"
          stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
